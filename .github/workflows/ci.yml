name: Build packages
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: "signing key"
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: Build packages
      run: |
        echo "$GITHUB_REPOSITORY" > ./repo
        echo -n "$GPG_SIGNING_KEY" > ./gpg_key
        docker run -t -v $PWD:/build archlinux:latest /bin/bash /build/entrypoint.sh
        ls -l .
      env:
        GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        
    - name: Print sha512sums
      run: sha512sum */*.pkg.tar.*

    - name: Upload Packages Artifact
      uses: actions/upload-artifact@v4
      with:
        name: x13s-packages-${{ github.sha }}
        path: |
          ${{ github.workspace }}/*.pkg.tar.*
          ${{ github.workspace }}/*-x13s.files*
          ${{ github.workspace }}/*-x13s.db*

    - name: Release 
      if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no rel]') }}
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ github.workspace }}/*.pkg.tar.*
          ${{ github.workspace }}/*-x13s.files*
          ${{ github.workspace }}/*-x13s.db*
        tag_name: packages 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
